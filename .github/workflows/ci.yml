name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: flowdesk_test, POSTGRES_USER: flowdesk, POSTGRES_PASSWORD: secret }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowdesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Pint
        run: vendor/bin/pint --test
        working-directory: backend
      - name: Tests
        working-directory: backend
        env:
          APP_KEY: base64:dGVzdGVzdGVzdGVzdGVzdGVzdGVzdGVzdGVzdGVzdGVz
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: flowdesk_test
          DB_USERNAME: flowdesk
          DB_PASSWORD: secret
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
